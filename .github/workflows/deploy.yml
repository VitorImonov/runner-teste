
name: Deploy CWP - Testeru

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testeru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Preparar arquivos para deploy
        shell: bash
        run: |
          set -euo pipefail

          DESTINO="/home/github-runner/deploy-staging/testeru"

          rsync -rtv --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy-trigger' \
            "$GITHUB_WORKSPACE/" \
            "$DESTINO/"

      - name: Publicar arquivos no CWP
        shell: bash
        run: |
          set -euo pipefail

          sudo -n /usr/bin/systemctl start deploy-testeru.service

          echo "Publicacao concluida com sucesso."

      - name: Confirmar deploy
        run: |
          echo "Deploy finalizado."
          echo "Commit publicado: $GITHUB_SHA"
