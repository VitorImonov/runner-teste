
name: Deploy CWP - Testeru

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testeru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Preparar arquivos para deploy
        run: |
          rsync -rtv --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy-trigger' \
            "$GITHUB_WORKSPACE/" \
            /home/github-runner/deploy-staging/testeru/

      - name: Solicitar publicacao
        run: |
          touch /home/github-runner/deploy-staging/testeru/.deploy-trigger

      - name: Confirmar preparacao
        run: |
          echo "Arquivos preparados e publicacao solicitada."
